name: entregable2

x-common: &playwright
  image: e2-playwright
  build:
    context: .
    dockerfile: Dockerfile
    args:
      PLAYWRIGHT_VERSION: "1.56.1"
  env_file:
    - .env
  user: "0:0"
  volumes:
    - ./reports:/home/pwuser/app/reports
    - ./.auth:/home/pwuser/app/.auth

services:
  real:
    <<: *playwright
    environment:
      AUTH_MODE: "real"

  mock:
    <<: *playwright
    environment:
      AUTH_MODE: "mock"
      DOCKER_HOST: "unix:///var/run/docker.sock"
      TESTCONTAINERS_HOST_OVERRIDE: "host.docker.internal"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./reports:/home/pwuser/app/reports
      - ./.auth:/home/pwuser/app/.auth